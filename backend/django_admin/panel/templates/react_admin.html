<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Speeck — Admin Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070a13;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .smooth-fade {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#070a13] text-slate-100 min-h-screen relative antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Ambient Neon Glow Effects (bottom-left cyan and bottom-right purple) -->
  <div class="fixed -bottom-48 -left-48 w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[150px] pointer-events-none z-0"></div>
  <div class="fixed -bottom-48 -right-48 w-[500px] h-[500px] bg-purple-600/25 rounded-full blur-[150px] pointer-events-none z-0"></div>
  <div class="fixed -top-40 right-1/3 w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none z-0"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const API_BASE = "/api/admin";

    // ── SVG Icons ──────────────────────────────────────────────────────────
    function Icon({ name, className = "w-5 h-5" }) {
      const icons = {
        home: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">

        ),
        users: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">

        device: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
          </svg>
        ),
        settings: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        bell: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
          </svg>
        ),
        history: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        logout: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
        ),
        refresh: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        ),
        lock: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        ),
        diamond: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 3h12l4 6-10 12L2 9l4-6z" />
          </svg>
        ),
        phone: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
        ),
        server: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 01-3-3m3 3a3 3 0 100 6h13.5a3 3 0 100-6m-16.5-3a3 3 0 013-3h13.5a3 3 0 013 3m-19.5 0a4.5 4.5 0 01.9-2.7L5.75 5.1a3 3 0 012.4-1.35h7.7a3 3 0 012.4 1.35l1.6 3.15a4.5 4.5 0 01.9 2.7" />
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
          </svg>
        ),
        search: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        ),
      };
      return icons[name] || null;
    }

    function GoogleIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      );
    }

    function updateEncryptedUrl(tab, csrfToken, sessionSig) {
      if (typeof window === "undefined") return;
      const ts = Date.now().toString(36);
      const randSeed = Math.random().toString(36).substring(2, 8);
      const hashSig = btoa(`${tab}:${sessionSig || 'gate'}:${randSeed}:${ts}`).replace(/=/g, '');
      const newUrl = `${window.location.pathname}?csrf=${csrfToken || 'sec'}&sec_gate=${hashSig.slice(0, 16)}#/${tab}/${hashSig}`;
      window.history.replaceState(null, '', newUrl);
    }

    function App() {
      const [adminToken, setAdminToken] = useState(() => localStorage.getItem("lingo_admin_token"));
      const [csrfData, setCsrfData] = useState(() => ({
        token: localStorage.getItem("lingo_admin_csrf") || "a4fbddc25e89",
        sig: localStorage.getItem("lingo_admin_sig") || ""
      }));

      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [loggingIn, setLoggingIn] = useState(false);

      const [currentTab, setCurrentTab] = useState("overview");
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      const [stats, setStats] = useState(null);
      const [users, setUsers] = useState([]);
      const [userSearch, setUserSearch] = useState("");
      const [complaints, setComplaints] = useState([]);
      const [devices, setDevices] = useState([]);
      const [settingsData, setSettingsData] = useState({
        maintenanceMode: false,
        defaultSignupDiamonds: 50,
        matchCostDiamonds: 0,
        dailyRewardDiamonds: 20,
        allowGuestMatch: true,
        chatMessageFilter: true,
        platformNotice: ""
      });
      const [announcements, setAnnouncements] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      const [diamondModalUser, setDiamondModalUser] = useState(null);
      const [diamondAmount, setDiamondAmount] = useState("50");

      const notify = (text, type = "success") => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        fetch(`${API_BASE}/csrf/`)
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              const csrf = data.csrfToken;
              const sig = data.urlSignature;
              setCsrfData({ token: csrf, sig });
              localStorage.setItem("lingo_admin_csrf", csrf);
              localStorage.setItem("lingo_admin_sig", sig);
              if (!adminToken) {
                updateEncryptedUrl("auth-gate", csrf, sig);
              }
            }
          })
          .catch(() => {});
      }, [adminToken]);

      useEffect(() => {
        if (adminToken) {
          updateEncryptedUrl(currentTab, csrfData.token, csrfData.sig);
        }
      }, [currentTab, adminToken, csrfData]);

      const api = useCallback(async (path, method = "GET", body = null) => {
        const headers = {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfData.token || ""
        };
        if (adminToken) headers["Authorization"] = `Bearer ${adminToken}`;
        const res = await fetch(`${API_BASE}${path}`, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null
        });
        return await res.json();
      }, [adminToken, csrfData]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        setLoggingIn(true);
        try {
          const res = await api("/login/", "POST", { username, password });
          if (res.success && res.token) {
            localStorage.setItem("lingo_admin_token", res.token);
            setAdminToken(res.token);
            if (res.csrfToken) {
              setCsrfData({ token: res.csrfToken, sig: res.urlSignature });
              localStorage.setItem("lingo_admin_csrf", res.csrfToken);
              localStorage.setItem("lingo_admin_sig", res.urlSignature);
              updateEncryptedUrl("overview", res.csrfToken, res.urlSignature);
            }
            notify("Admin panelga muvaffaqiyatli kirdingiz!");
          } else {
            setLoginError(res.message || "Kirish rad etildi");
          }
        } catch {
          setLoginError("Server bilan aloqa o'rnatib bo'lmadi");
        } finally {
          setLoggingIn(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("lingo_admin_token");
        setAdminToken(null);
        updateEncryptedUrl("auth-gate", csrfData.token, csrfData.sig);
      };

      const loadData = useCallback(async () => {
        if (!adminToken) return;
        setLoading(true);
        try {
          const [statsRes, usersRes, complaintsRes, devicesRes, settingsRes, annRes, logsRes] = await Promise.all([
            api("/stats/"),
            api("/users/"),
            api("/complaints/"),
            api("/devices/"),
            api("/settings/"),
            api("/announcements/"),
            api("/logs/")
          ]);
          if (statsRes.success) setStats(statsRes.stats);
          if (usersRes.success) setUsers(usersRes.users || []);
          if (complaintsRes.success) setComplaints(complaintsRes.complaints || []);
          if (devicesRes.success) setDevices(devicesRes.devices || []);
          if (settingsRes.success && settingsRes.settings) setSettingsData(settingsRes.settings);
          if (annRes.success) setAnnouncements(annRes.announcements || []);
          if (logsRes.success) setAuditLogs(logsRes.logs || []);
        } catch {
          notify("Ma'lumotlarni yuklashda xatolik yuz berdi", "error");
        } finally {
          setLoading(false);
        }
      }, [adminToken, api]);

      useEffect(() => {
        if (adminToken) {
          loadData();
        }
      }, [adminToken, loadData]);

      const handleUserAction = async (userId, action, extra = {}) => {
        try {
          const res = await api(`/users/${userId}/action/`, "POST", { action, ...extra });
          if (res.success) {
            notify(res.message || "Amal muvaffaqiyatli bajarildi");
            loadData();
            setDiamondModalUser(null);
          } else {
            notify(res.message || "Xatolik", "error");
          }
        } catch {
          notify("Amalni bajarishda xatolik", "error");
        }
      };

      const handleComplaintAction = async (complaintId, action) => {
        try {
          const res = await api(`/complaints/${complaintId}/action/`, "POST", { action });
          if (res.success) {
            notify(res.message || "Shikoyat holati yangilandi");
            loadData();
          }
        } catch {
          notify("Xatolik yuz berdi", "error");
        }
      };

      const handleDeviceAction = async (sessionId, action) => {
        try {
          const res = await api(`/devices/${sessionId}/action/`, "POST", { action });
          if (res.success) {
            notify(res.message || "Qurilma holati yangilandi");
            loadData();
          }
        } catch {
          notify("Xatolik yuz berdi", "error");
        }
      };

      const filteredUsers = useMemo(() => {
        if (!userSearch.trim()) return users;
        const q = userSearch.toLowerCase();
        return users.filter(u =>
          (u.name && u.name.toLowerCase().includes(q)) ||
          (u.email && u.email.toLowerCase().includes(q)) ||
          (u.phone && u.phone.includes(q)) ||
          u.id.includes(q)
        );
      }, [users, userSearch]);

      // ── LOGIN SCREEN ───────────────────────────────────────────────────────
      if (!adminToken) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 bg-[#070a13] font-sans">
            <div className="w-full max-w-md rounded-3xl border border-white/10 bg-[#0d1527]/85 p-8 shadow-2xl backdrop-blur-2xl smooth-fade">
              <div className="flex flex-col items-center text-center mb-8">
                <div className="h-14 w-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-3 text-white flex items-center justify-center shadow-lg shadow-emerald-500/30 mb-4">
                  <Icon name="shield" className="w-8 h-8" />
                </div>
                <div className="flex items-center gap-2">
                  <h1 className="text-2xl font-black tracking-tight text-white">Lingo Speeck</h1>
                  <span className="rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 text-xs font-bold">ADMIN</span>
                </div>
                <div className="mt-3 flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs font-mono text-zinc-400">
                  <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>CSRF: {csrfData.token.slice(0, 10)}...</span>
                </div>
              </div>

              {loginError && (
                <div className="mb-6 rounded-2xl border border-rose-500/30 bg-rose-500/15 p-4 text-xs text-rose-300 flex items-center gap-3">
                  <Icon name="alert" className="w-5 h-5 text-rose-400 shrink-0" />
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-300 mb-2">Admin Foydalanuvchi</label>
                  <input
                    type="text"
                    required
                    placeholder="admin"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full rounded-2xl border border-white/10 bg-[#070d1a] px-4 py-3 text-sm text-white placeholder-zinc-500 focus:border-cyan-400 focus:outline-none"
                  />
                </div>

                    className="rounded-2xl bg-gradient-to-r from-teal-500 to-cyan-500 px-5 py-2 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-500/20 hover:opacity-95 transition-all"
                  >
                    Saqlash
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
